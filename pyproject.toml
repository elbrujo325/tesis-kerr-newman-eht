[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eht_tesis"
version = "0.1.0"
description = "Análisis EHT para tesis Kerr-Newman carga débil"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "astropy>=5.3",
    "ehtim>=0.5",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["."]
include = ["eht_tesis*"]
exclude = ["datos*", "figuras*", "venv_eht*", "resultados*", "tests*"]